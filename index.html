<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feniks Travel - Transferi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#d32027', 600: '#d32027', 700: '#b91c1c', 800: '#991b1b' },
            brandGray: '#7e8083'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    
    <!-- Zaglavlje -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h1 class="text-2xl font-bold text-red-600 flex items-center gap-2">
          <i data-lucide="car"></i> Feniks Travel
        </h1>
        <span class="text-sm bg-green-100 text-green-800 px-3 py-1 rounded-full font-medium">Sinhronizovano</span>
      </div>

      <!-- POLJE ZA BRZI UNOS (SMART PASTE) -->
      <div class="bg-red-50 p-4 rounded-lg border border-red-200 mb-6">
        <label class="block text-sm font-semibold text-red-800 mb-1 flex items-center gap-1">
          ⚡ Brzi unos iz poruke (Viber / WhatsApp / Mail)
        </label>
        <p class="text-xs text-red-600 mb-2">Zalepite ili ukucajte ceo tekst poruke ispod, pa kliknite na "Popuni formu":</p>
        <textarea id="smartPaste" rows="3" class="w-full p-2 border rounded-md text-sm focus:ring-2 focus:ring-red-500" placeholder="Primer: Marko Markovic, let JU123 u 18:30, Beograd -> Cirih, vozac Goran, cena 50e"></textarea>
        <button type="button" onclick="parseMessage()" class="mt-2 bg-red-600 text-white px-4 py-2 rounded-md font-medium text-sm hover:bg-red-700 transition flex items-center gap-2">
          <i data-lucide="wand-2" class="w-4 h-4"></i> Popuni formu iz teksta
        </button>
      </div>

      <!-- Forma za rezervaciju -->
      <form id="transferForm" onsubmit="saveTransfer(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Putnik / Grupa</label>
          <input type="text" id="passenger" required class="w-full p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Let / Napomena</label>
          <input type="text" id="flight" class="w-full p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Datum i Vreme</label>
          <input type="text" id="time" placeholder="npr. 18:30" class="w-full p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ruta / Relacija</label>
          <input type="text" id="route" placeholder="Beograd -> Cirih" class="w-full p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Vozač</label>
          <input type="text" id="driver" class="w-full p-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cena (€)</label>
          <input type="text" id="price" class="w-full p-2 border rounded-md">
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full bg-gray-800 text-white py-3 rounded-md font-bold text-lg hover:bg-gray-900 transition">Sačuvaj Rezervaciju</button>
        </div>
      </form>
    </div>

    <!-- Tabela / Lista transfera -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Pregled Transfera</h2>
      <div id="transferList" class="space-y-3">
        <p class="text-gray-500 text-sm">Nema unetih transfera.</p>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Funkcija za raščlanjivanje teksta
    function parseMessage() {
      const text = document.getElementById('smartPaste').value;
      if (!text) {
        alert('Molimo vas unesite ili zalepite tekst u polje!');
        return;
      }

      // Prepoznavanje vremena (npr. 18:30)
      const timeMatch = text.match(/\b([01]?[0-9]|2[0-3]):[0-5][0-9]\b/);
      if (timeMatch) document.getElementById('time').value = timeMatch[0];

      // Prepoznavanje leta (npr. JU123, LX1410)
      const flightMatch = text.match(/\b([A-Z0-9]{2}\s?\d{3,4})\b/i);
      if (flightMatch) document.getElementById('flight').value = flightMatch[0].toUpperCase();

      // Prepoznavanje cene (npr. 50e, 50 EUR, 50din)
      const priceMatch = text.match(/(\d+)\s*(eur|€|rsd|din|e)/i);
      if (priceMatch) document.getElementById('price').value = priceMatch[1] + ' €';

      // Prva linija ili tekst za putnika
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length > 0) {
        const firstLine = lines[0].split(',')[0];
        document.getElementById('passenger').value = firstLine;
      }

      alert('Podaci su uspešno izvučeni i popunjeni u formu!');
    }

    // Sačuvanje transfera
    function saveTransfer(e) {
      e.preventDefault();
      const passenger = document.getElementById('passenger').value;
      const flight = document.getElementById('flight').value;
      const time = document.getElementById('time').value;
      const route = document.getElementById('route').value;
      const driver = document.getElementById('driver').value;
      const price = document.getElementById('price').value;

      const list = document.getElementById('transferList');
      if (list.innerHTML.includes('Nema unetih')) list.innerHTML = '';

      const item = document.createElement('div');
      item.className = 'p-4 border rounded-lg bg-gray-50 flex justify-between items-center';
      item.innerHTML = `
        <div>
          <span class="font-bold text-lg text-gray-800">${passenger}</span>
          <span class="text-sm bg-red-100 text-red-800 px-2 py-0.5 rounded ml-2">${flight || 'Bez leta'}</span>
          <div class="text-sm text-gray-600 mt-1">🕒 ${time || 'Nije navedeno'} | 📍 ${route || 'Nije navedeno'} | 👤 Vozač: ${driver || 'Nije dodeljen'}</div>
        </div>
        <div class="font-bold text-green-700 text-lg">${price || '0 €'}</div>
      `;
      list.prepend(item);

      // Resetuj formu
      document.getElementById('transferForm').reset();
      document.getElementById('smartPaste').value = '';
    }
  </script>
</body>
</html>
